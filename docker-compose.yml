services:
  mysql:
    image: mysql:8.4
    container_name: padel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_only_for_bootstrap
      MYSQL_DATABASE: padel
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - padel-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_only_for_bootstrap"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  padel-mysql-data:
